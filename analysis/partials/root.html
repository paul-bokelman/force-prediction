<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metrics Report</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 16px 40px;
      }

      h1 {
        font-size: 28px;
        font-weight: 600;
      }

      span {
        font-size: 18px;
      }

      .divider {
        border-top: 1px solid #cfcfcf;
        margin: 20px 0;
      }

      /* candidate information */
      .candidate-information {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .attr-list {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        column-gap: 24px;
        row-gap: 8px;
      }

      .attr-list span:first-of-type {
        text-transform: capitalize;
      }

      .attr-list span:nth-of-type(2) {
        font-weight: 600;
        color: #0060e7;
      }

      .candidate-information .ci-hyperparameters {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .candidate-information .ci-hyperparameters > span {
        font-weight: 600;
        text-transform: uppercase;
        font-size: 14px;
        margin-bottom: 8px;
      }

      .evaluation_metrics .flag {
        background-color: #e6ffed;
        border-left: 4px solid #28a745;
        padding: 8px 12px;
        margin: 4px 0;
        font-size: 16px;
        color: #155724;
        border-radius: 3px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .evaluation_metrics .flag span {
        color: #155724;
      }

      .training-history {
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
      }

      .predictions {
        display: grid;
        grid-template-rows: repeat(2, 1fr);
        gap: 16px;
      }

      .predictions img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
        max-width: 100%;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>{{candidate_identifier}}</h1>
    <div class="divider"></div>
    {{candidate_information}}
    <div class="divider"></div>
    <div class="evaluation_metrics">{{evaluation_metrics}}</div>
    <div class="divider"></div>
    <div class="training-history">{{training_history}}</div>
    <div class="divider"></div>
    <div class="predictions">{{predictions}}</div>
  </body>
</html>
